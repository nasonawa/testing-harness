# Quay configuration for the LDAP test harness (PROJQUAY-13372).
#
# local-dev/stack/config.yaml merged with local-dev/ldap/ldap-config.yaml,
# with the Playwright LDAP users (admin_ldap / readonly_ldap) promoted to
# their Quay roles. Storage is LocalStorage: no Garage/S3 services in this
# harness, so the object-storage and geo-replication specs are not runnable
# here (they are unrelated to LDAP authentication).
SUPER_USERS:
  - admin
  - user1
  - quayadmin
  - admin_ldap
GLOBAL_READONLY_SUPER_USERS:
  - quayadmin
  - readonly
  - readonly_ldap
AUTHENTICATION_TYPE: LDAP
LDAP_URI: ldap://quay-ldap:3389
LDAP_ADMIN_DN: cn=Directory Manager
LDAP_ADMIN_PASSWD: admin
LDAP_BASE_DN:
  - dc=example
  - dc=org
LDAP_USER_RDN:
  - ou=users
LDAP_UID_ATTR: uid
LDAP_EMAIL_ATTR: mail
LDAP_MEMBEROF_ATTR: quayMemberOf
LDAP_ALLOW_INSECURE_FALLBACK: true
BITTORRENT_FILENAME_PEPPER: 0ee18f90-5b6d-42d2-ab5e-ec9fcd846272
BUILDLOGS_REDIS:
  host: quay-redis
  port: 6379
DB_URI: postgresql://quay:quay@quay-db/quay
DATABASE_SECRET_KEY: '30060361640793187613697366923211113205676925445650250274752125083971638376224'
DEFAULT_TAG_EXPIRATION: 2w
PERMANENTLY_DELETE_TAGS: true
DISTRIBUTED_STORAGE_CONFIG:
  default:
  - LocalStorage
  - storage_path: /datastorage/registry
DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS: []
DISTRIBUTED_STORAGE_PREFERENCE:
  - default
ENTERPRISE_LOGO_URL: /static/img/quay-horizontal-color.svg
EXTERNAL_TLS_TERMINATION: true
FEATURE_ANONYMOUS_ACCESS: true
FEATURE_SUPER_USERS: true
FEATURE_SUPERUSERS_FULL_ACCESS: true
FEATURE_APP_SPECIFIC_TOKENS: true
FEATURE_BUILD_SUPPORT: false
FEATURE_CHANGE_TAG_EXPIRATION: true
FEATURE_DIRECT_LOGIN: true
FEATURE_GARBAGE_COLLECTION: false
FEATURE_IMAGE_PULL_STATS: false
FEATURE_MAILING: true
FEATURE_PARTIAL_USER_AUTOCOMPLETE: true
FEATURE_REPO_MIRROR: true
FEATURE_ORG_MIRROR: true
FEATURE_REQUIRE_TEAM_INVITE: true
FEATURE_RESTRICTED_V1_PUSH: false
FEATURE_SECURITY_NOTIFICATIONS: false
FEATURE_SECURITY_SCANNER: false
FEATURE_USERNAME_CONFIRMATION: true
FEATURE_USER_CREATION: true
FEATURE_USER_LOG_ACCESS: false
FEATURE_PROXY_CACHE: true
FEATURE_TEAM_SYNCING: true
FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP: true
FEATURE_UI_V2: true
FEATURE_USER_METADATA: true
GITHUB_LOGIN_CONFIG: {}
GITHUB_TRIGGER_CONFIG: {}
GITLAB_TRIGGER_KIND: {}
LOG_ARCHIVE_LOCATION: default
MAIL_DEFAULT_SENDER: quay@localhost
MAIL_SERVER: quay-mailpit
MAIL_PORT: 1025
MAIL_USE_TLS: false
PREFERRED_URL_SCHEME: http
REGISTRY_TITLE: Red Hat Quay
REGISTRY_TITLE_SHORT: Red Hat Quay
REPO_MIRROR_SERVER_HOSTNAME: null
REPO_MIRROR_TLS_VERIFY: false
SERVER_HOSTNAME: localhost:8080
SETUP_COMPLETE: true
SESSION_TIMEOUT: 2h
SIGNING_ENGINE: gpg2
TAG_EXPIRATION_OPTIONS:
- 0s
- 1d
- 1w
- 2w
- 4w
TEAM_RESYNC_STALE_TIME: 60m
TESTING: false
USERFILES_LOCATION: default
USERFILES_PATH: userfiles/
USER_EVENTS_REDIS:
  host: quay-redis
  port: 6379
PULL_METRICS_REDIS:
  host: quay-redis
  port: 6379
  db: 1
USE_CDN: false
FEATURE_QUOTA_MANAGEMENT: true
FEATURE_EDIT_QUOTA: true
FEATURE_AUTO_PRUNE: true
FEATURE_IMMUTABLE_TAGS: true
FEATURE_IMMUTABLE_TAGS_CAN_EXPIRE: false
DEFAULT_NAMESPACE_AUTOPRUNE_POLICY:
  method: number_of_tags
  value: 100
BROWSER_API_CALLS_XHR_ONLY: False
CORS_ORIGIN:
  - "http://localhost:9000"
DEFAULT_UI: "react"
SSRF_ALLOWED_HOSTS:
  - playwright
  - host.docker.internal

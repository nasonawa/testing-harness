# Quay config bundle for the operator-installed LDAP harness.
#
# This is the harness config/stack/config.yaml reduced to the keys the
# operator does not manage itself. The operator provisions and injects
# DB_URI, Redis, Clair, mail, SERVER_HOSTNAME and TLS; those keys must NOT
# appear here (the operator validates the bundle strictly — there is no
# IGNORE_VALIDATION escape hatch on OCP). Storage IS ours: objectstorage is
# unmanaged in the QuayRegistry, so the LocalStorage block below is the
# storage configuration Quay runs with.
#
# Dev-only fixture credentials (Directory Manager "admin"): intentional, see
# the repo AGENTS.md security note.
apiVersion: v1
kind: Secret
metadata:
  name: quay-config-bundle-ldap
  namespace: quay-ldap-harness
type: Opaque
stringData:
  config.yaml: |
    # LDAP authentication against the in-cluster 389 DS Deployment.
    AUTHENTICATION_TYPE: LDAP
    LDAP_URI: ldap://quay-ldap.quay-ldap-harness.svc.cluster.local:3389
    LDAP_ADMIN_DN: cn=Directory Manager
    LDAP_ADMIN_PASSWD: admin
    LDAP_BASE_DN:
      - dc=example
      - dc=org
    LDAP_USER_RDN:
      - ou=users
    LDAP_UID_ATTR: uid
    LDAP_EMAIL_ATTR: mail
    LDAP_MEMBEROF_ATTR: quayMemberOf
    LDAP_ALLOW_INSECURE_FALLBACK: true

    SUPER_USERS:
      - admin
      - user1
      - quayadmin
      - admin_ldap
    GLOBAL_READONLY_SUPER_USERS:
      - quayadmin
      - readonly
      - readonly_ldap

    # Local filesystem storage (matches the compose harness's
    # config/stack/config.yaml). objectstorage is unmanaged in the
    # QuayRegistry, so this is the storage configuration Quay runs with.
    # NOTE: the operator's quay-app Deployment mounts no PVC at
    # /datastorage — registry data is EPHEMERAL (lost on pod restart).
    # Acceptable for this verify-only harness; swap in S3/RHOCS/GCS here
    # and flip objectstorage back to managed: true for anything durable.
    DISTRIBUTED_STORAGE_CONFIG:
      default:
        - LocalStorage
        - storage_path: /datastorage/registry
    DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS: []
    DISTRIBUTED_STORAGE_PREFERENCE:
      - default

    SETUP_COMPLETE: true
    FEATURE_SUPER_USERS: true
    FEATURE_SUPERUSERS_FULL_ACCESS: true
    FEATURE_DIRECT_LOGIN: true
    FEATURE_USER_CREATION: false
    FEATURE_USERNAME_CONFIRMATION: true
    FEATURE_TEAM_SYNCING: true
    FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP: true
    FEATURE_REPO_MIRROR: true
    FEATURE_ORG_MIRROR: true
    TEAM_RESYNC_STALE_TIME: 60m

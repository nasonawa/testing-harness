# Verify Job template — applied by `./run.sh ocp verify` (not by ocp apply),
# which appends a timestamp to the Job name on every run.
#
# The container runs the SAME verify.py as the compose mode (mounted from the
# quay-harness-verify ConfigMap that run.py generates from this harness's
# verify.py + ldap/base.ldif), with --log-source ocp so logs are read through
# the Kubernetes API using this pod's service account. QUAY_BASE_URL,
# K8S_NAMESPACE and QUAY_POD_LABEL are injected from the
# quay-harness-params ConfigMap (also generated by run.py).
#
# verify.py prints verify.md between marker lines; run.py extracts it from
# the Job logs into reports/runs/<ts>-ocp/verify.md. backoffLimit: 0 — a
# failed check must surface, not retry into a confusing transcript.
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-harness-verify-job
  namespace: quay-ldap-harness
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: quay-harness-verify
    spec:
      restartPolicy: Never
      serviceAccountName: quay-harness-verify
      containers:
        - name: verify
          image: python:3.12-slim
          command: ["python3", "/verify/verify.py"]
          args:
            - --log-source
            - ocp
            - --ldif
            - /verify/base.ldif
            - --report-dir
            - /tmp/report
            - --print-report
          envFrom:
            - configMapRef:
                name: quay-harness-params
          volumeMounts:
            - name: verify
              mountPath: /verify
              readOnly: true
      volumes:
        - name: verify
          configMap:
            name: quay-harness-verify

# QuayRegistry deployed by the quay-operator (install it via OLM first:
# https://docs.projectquay.io/deploy_quay_on_openshift_op_tng.html).
#
# postgres, redis and the Route are operator-managed. objectstorage is
# UNMANAGED: the config bundle provides LocalStorage (see
# config-bundle.yaml — no RHOCS/ODF dependency, but registry data is
# ephemeral; the compose harness's Garage S3 georeplication stays
# compose-only). The repo mirror is disabled (not under test); Clair is
# enabled so the scanner wiring matches the compose harness — flip it to
# managed: false if the cluster lacks the resources.
#
# `./run.sh ocp apply` waits for the Available condition (~10-15 min on a
# fresh namespace: the operator rolls out every managed component).
apiVersion: operators.coreos.com/v1
kind: QuayRegistry
metadata:
  name: quay
  namespace: quay-oidc-harness
spec:
  configBundleSecret: quay-config-bundle-oidc
  components:
    - kind: postgres
      managed: true
    - kind: redis
      managed: true
    - kind: objectstorage
      managed: false
    - kind: route
      managed: true
    - kind: clair
      managed: true
    - kind: mirror
      managed: false
    - kind: horizontalpodautoscaler
      managed: false

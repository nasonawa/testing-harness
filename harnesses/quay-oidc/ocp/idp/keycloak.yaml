# Keycloak (identity provider for the OIDC harness) on OpenShift, deployed by
# the "Red Hat build of Keycloak" operator (RHBK, install it via OLM first).
#
# The operator requires a database: the dev-only ephemeral Postgres next to
# this file (keycloak-db.yaml) provides one. The initial admin credentials
# are auto-generated by the operator into the Secret
# `quay-keycloak-initial-admin` (the harness never needs them: the realm is
# imported via KeycloakRealmImport and verification is API-only).
#
# spec.http.serviceName pins the operator-created Service to `quay-keycloak`
# so the OIDC issuer stays http://quay-keycloak.quay-oidc-harness.svc.cluster.local:8080
# — the exact URL Quay's config bundle and run.py's params reference.
# hostname.hostname embeds the same URL (KC hostname v2 accepts full URLs)
# and backchannelDynamic matches the compose stack's
# KC_HOSTNAME_BACKCHANNEL_DYNAMIC so the discovery issuer matches.
#
# Dev-only fixture credentials (keycloak/keycloak DB): intentional, see the
# repo AGENTS.md security note.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: quay-keycloak
  namespace: quay-oidc-harness
spec:
  instances: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  db:
    vendor: postgres
    host: quay-keycloak-db
    database: keycloak
    usernameSecret:
      name: quay-keycloak-db
      key: username
    passwordSecret:
      name: quay-keycloak-db
      key: password
  http:
    httpEnabled: true
    serviceName: quay-keycloak
  hostname:
    hostname: http://quay-keycloak.quay-oidc-harness.svc.cluster.local:8080
    backchannelDynamic: true

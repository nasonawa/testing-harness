# The on-cluster identity provider: Keycloak as a CR of the Red Hat build of
# Keycloak operator (install it via OLM first), its dev-only Postgres, and
# the KeycloakRealmImport CR (tracked so the kustomization applies
# standalone; refreshed from keycloak/quay-realm.json by run.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - keycloak-db.yaml
  - keycloak.yaml
  - quay-oidc-realm.yaml

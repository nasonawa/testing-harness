# The on-cluster identity provider: Keycloak plus the realm ConfigMap it
# imports at startup (quay-oidc-realm.yaml, tracked so the kustomization
# applies standalone; refreshed from keycloak/quay-realm.json by run.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - keycloak.yaml
  - quay-oidc-realm.yaml

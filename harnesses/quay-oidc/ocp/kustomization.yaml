# OpenShift variant of the OIDC harness (operator-installed Quay).
#
# Fully self-contained: a bare `oc apply -k ocp/` from a fresh clone deploys
# the namespace, Keycloak (+ realm), the config bundle and the QuayRegistry
# (OIDC + local storage). `./run.sh ocp apply|verify` wraps the same
# kustomization with waiting/reporting; `ocp verify` additionally applies
# the per-run verify Job and its generated ConfigMaps (ocp/generated/,
# gitignored).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - idp/
  - config-bundle.yaml
  - quayregistry.yaml
  - rbac.yaml
# verify-job.yaml is NOT here: `ocp verify` applies it per-run with a unique
# name and the resolved Quay Route URL (it also re-applies the generated
# ConfigMaps, since quay-harness-params carries the resolved URL).

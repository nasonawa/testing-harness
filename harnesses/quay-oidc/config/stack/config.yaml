# Pyroscope continuous profiling. To enable, uncomment and set PYROSCOPE_SERVER_ADDRESS for your setup:
# - Quay on host (e.g. make run): http://localhost:4040
# - Quay in Docker on Mac/Windows: http://host.docker.internal:4040
# - Quay and Pyroscope on same Docker network: http://pyroscope:4040
# PROFILING_TYPE: Pyroscope
# PYROSCOPE_SERVER_ADDRESS: http://localhost:4040

FEATURE_SPAM_DETECTION: true
SPAM_DETECTION_DRY_RUN: false
SPAM_DETECTION_FAIL_OPEN: false
SPAM_DETECTION_CLASSIFIER_PATH: /quay-registry/conf/stack/spam-classifier-e2e-v1.json
SPAM_DETECTION_CLASSIFIER_VERSION: e2e-v1
SPAM_DETECTION_CLASSIFIER_SHA256: 0861a11b624e0ed790530c8821930254a98f10cdc5c320d12e08a636a4fbc118

# ---------------------------------------------------------------------------
# OIDC / Keycloak configuration for the containerized Playwright harness.
# Derived from local-dev/keycloak/keycloak-config.yaml, with the issuer host
# switched to the compose service name so both Quay and the Playwright
# container can resolve it.
# ---------------------------------------------------------------------------
FEATURE_TEAM_SYNCING: true
FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP: true
FEATURE_ROBOT_API_TOKENS: true
FEATURE_ROBOT_API_TOKEN_EXCHANGE: true
FEATURE_SPARSE_INDEX: true
FEATURE_QUOTA_NOTIFICATIONS: true
FEATURE_SUPERUSER_CONFIGDUMP: true
# OpenTelemetry tracing to the Jaeger service (default OTLP/HTTP endpoint).
FEATURE_OTEL_TRACING: true
OTEL_CONFIG:
  service_name: quay
  sample_rate: 1.0
  endpoint: "http://jaeger:4318/v1/traces"
# Footer links exercised by the React UI specs (same values as CI).
FOOTER_LINKS:
  TERMS_OF_SERVICE_URL: https://quay.acme.org/terms
  PRIVACY_POLICY_URL: https://quay.acme.org/privacy
  SECURITY_URL: https://quay.acme.org/security
  ABOUT_URL: https://quay.acme.org/about
AUTOPRUNE_TASK_RUN_MINIMUM_INTERVAL_MINUTES: 0
SSRF_ALLOWED_HOSTS:
  - playwright
  - quay-keycloak
  - host.docker.internal

SOMEOIDC_LOGIN_CONFIG:
  SERVICE_NAME: "Keycloak"
  OIDC_SERVER: "http://quay-keycloak:8080/realms/quay/"
  CLIENT_ID: "quay-ui"
  # Quay's config validation requires CLIENT_SECRET even for public clients
  # (PUBLIC_CLIENT: true omits it from token requests; the Keycloak client
  # has no secret). Dummy value, same as the local-dev template.
  CLIENT_SECRET: "public-client-no-secret" # gitleaks:allow: dummy value for validation only
  LOGIN_SCOPES:
    - "openid"
    - "profile"
    - "email"
  PREFERRED_GROUP_CLAIM_NAME: "groups"
  SUPERUSER_GROUP: "quay-superusers"
  GLOBAL_READONLY_SUPERUSER_GROUP: "quay-readonly"
  DEBUGGING: true
  USE_PKCE: true
  PKCE_METHOD: "S256"
  PUBLIC_CLIENT: true
  OIDC_ISSUERS:
    - "http://quay-keycloak:8080/realms/quay"
  OIDC_AUDIENCES:
    - "quay-ui"
    - "api://quay-api"
  OIDC_ALLOWED_CLIENTS:
    - "quay-ui"
    - "quay-obo"
    - "quay-unknown-aud"

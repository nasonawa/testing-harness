# Quay configuration for the OIDC test harness (standalone port).
#
# Derived from the quay repo's local-dev stack configs (stack, keycloak,
# georep, builds) — provenance details in the quay repo's
# .cursor/oidc-testing/config/stack/config.yaml history. Service hostnames
# (quay-db, quay-redis, quay-keycloak, quay-mailpit, garage, jaeger) resolve
# on the compose network. Build support requires source mode: run.py
# extracts local-dev/quay-builder from the QUAY_REPO_ROOT checkout; in pull
# mode the builder mount is empty and build specs are not runnable.
SUPER_USERS:
  - admin
  - admin_oidc
GLOBAL_READONLY_SUPER_USERS:
  - quayadmin
  - readonly
AUTHENTICATION_TYPE: OIDC
DEBUG: true
BITTORRENT_FILENAME_PEPPER: 0ee18f90-5b6d-42d2-ab5e-ec9fcd846272
BUILDLOGS_REDIS:
  host: quay-redis
  port: 6379
# Build support (mirrors local-dev/builds/builds-config.yaml). The
# PopenExecutor forks the quay-builder binary mounted into the container and
# talks to the host Docker daemon through DOCKER_HOST (see compose.yaml).
BUILD_MANAGER:
  - ephemeral
  - ORCHESTRATOR:
      REDIS_HOST: quay-redis
      REDIS_PORT: 6379
    EXECUTORS:
      - EXECUTOR: popen
        BUILDER_BINARY_LOCATION: /quay-builder/quay-builder
        NAME: ci-builder
        CONTAINER_RUNTIME: docker
        INSECURE: true
        DEBUG: true
        SETUP_TIME: 120
DB_URI: postgresql://quay:quay@quay-db/quay
DATABASE_SECRET_KEY: '30060361640793187613697366923211113205676925445650250274752125083971638376224'
DEFAULT_TAG_EXPIRATION: 2w
PERMANENTLY_DELETE_TAGS: true
# Two-region geo-replication backed by Garage (mirrors
# local-dev/garage/georep-config.yaml, used by CI with with-georep: true).
# There is deliberately no LocalStorage backend: the replication worker
# refuses to start when one is configured.
DISTRIBUTED_STORAGE_CONFIG:
  us_east:
  - RadosGWStorage
  - hostname: garage
    is_secure: false
    storage_path: /datastorage/registry
    access_key: GKe2e0123456789abcdef01234 # gitleaks:allow: local Garage test key
    secret_key: e2e0123456789abcdef0123456789abcdef0123456789abcdef01234567890ab # gitleaks:allow: local Garage test key
    bucket_name: quay-us-east
    port: 3900
    signature_version: s3v4
  eu_west:
  - RadosGWStorage
  - hostname: garage
    is_secure: false
    storage_path: /datastorage/registry
    access_key: GKe2e0123456789abcdef01234 # gitleaks:allow: local Garage test key
    secret_key: e2e0123456789abcdef0123456789abcdef0123456789abcdef01234567890ab # gitleaks:allow: local Garage test key
    bucket_name: quay-eu-west
    port: 3900
    signature_version: s3v4
DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS:
  - us_east
  - eu_west
DISTRIBUTED_STORAGE_PREFERENCE:
  - us_east
FEATURE_STORAGE_REPLICATION: true
ENTERPRISE_LOGO_URL: /static/img/quay-horizontal-color.svg
EXTERNAL_TLS_TERMINATION: true
FEATURE_ANONYMOUS_ACCESS: true
FEATURE_SUPER_USERS: true
FEATURE_SUPERUSERS_FULL_ACCESS: true
FEATURE_APP_SPECIFIC_TOKENS: true
FEATURE_BUILD_SUPPORT: true
FEATURE_CHANGE_TAG_EXPIRATION: true
FEATURE_DIRECT_LOGIN: true
FEATURE_GARBAGE_COLLECTION: false
FEATURE_IMAGE_PULL_STATS: false
FEATURE_MAILING: true
FEATURE_PARTIAL_USER_AUTOCOMPLETE: true
FEATURE_REPO_MIRROR: true
FEATURE_ORG_MIRROR: true
FEATURE_REQUIRE_TEAM_INVITE: true
FEATURE_RESTRICTED_V1_PUSH: false
